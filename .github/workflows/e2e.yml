# Playwright smoke suite.
#
# doc 19 §4 heads the suite "every PR" while doc 21 §1 wires it label-gated —
# a contradiction found 2026-08-10. Resolved toward doc 19: the suite is a
# correctness gate and is budgeted at under three minutes, so it runs on every
# PR. The `e2e` label is kept as a way to force a run from a branch push.
name: e2e

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '41 2 * * *'

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run smoke suite
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
