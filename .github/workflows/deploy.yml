# Production deploy to the tilepier Worker on tilepier.win.
#
# Runs only after ci succeeds on main — `workflow_run` rather than a push
# trigger, so a red CI cannot ship. doc 21 §4.
name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # One script, not a build step followed by a bare `wrangler deploy`.
      # `wrangler deploy` has no dependency on the build, so invoking it on its
      # own — after a clean, on a fresh clone, or in a workflow whose build step
      # was reordered — fails with "The entry-point file at
      # '.svelte-kit/cloudflare/_worker.js' was not found." Making the script
      # own the ordering means CI and a developer's machine cannot diverge.
      #
      # Secrets FINNHUB_KEY and TWELVEDATA_KEY are set with `wrangler secret
      # put` against the Worker, never passed through CI (doc 15 §6, doc 21 §4).
      - name: Build and deploy
        run: pnpm run deploy:prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
