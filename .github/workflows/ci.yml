# CI — lint, dead code, tests, build, bundle budgets, secret gate, and the
# SonarQube Cloud analysis of the result.
#
# Authored locally rather than as a caller stub into poli0981/.github: the
# seven wf-*.yml reusable workflows doc 21 §1 names do not exist there
# (verified 2026-08-10 — that repo uses a reusable-*.yml convention and has
# nothing for Cloudflare, Playwright, or release). Extract upward once stable;
# doc 21 carries the deviation note.
#
# `permissions:` is declared explicitly even though nothing here escalates —
# doc 21 §2, and the 2026-05 inheritance bug it documents.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sonar: ${{ steps.sonar.outputs.configured }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Third-party actions are pinned to a commit (SonarQube S7637); Dependabot
      # moves the pin and the version beside it together.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      # Whether the `sonar` job below can run. A Dependabot or fork pull request
      # gets no repository secrets, so it skips the analysis rather than failing
      # it, as notify.yml does without its webhook. The token stays in this one
      # step's environment.
      - id: sonar
        name: SonarQube Cloud configured?
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then echo "configured=true"; else echo "configured=false"; fi >> "$GITHUB_OUTPUT"

      - name: Install
        run: pnpm install --frozen-lockfile

      # Ordering matters: svelte-check walks the workspace directory, so build
      # output present during lint produces hundreds of errors in generated
      # code. Lint first, always.
      - name: Lint (prettier + eslint + svelte-check)
        run: pnpm lint

      - name: Dead code
        run: pnpm knip

      # doc 14 §4 has said "CI-blocking from Week 1" since it was written, and
      # this workflow never ran it — `pnpm verify` did, locally, which is not
      # the same gate at all: a red local run is a decision, a red CI run is a
      # closed door. Corrected 2026-08-27 alongside the two audits Week 2 turns
      # on (doc 14 §2, doc 20 §1), both of which had a zero backlog on the day,
      # so nothing had to be phased in.
      - name: i18n catalogue drift
        run: pnpm i18n:check

      - name: i18n hardcoded strings
        run: pnpm i18n:audit

      - name: Design tokens
        run: pnpm tokens:audit

      # The `client` Vitest project runs in real Chromium via
      # @vitest/browser-playwright. A dev machine usually has browsers already;
      # a fresh runner does not, and the failure is an opaque
      # "Executable doesn't exist" from inside the test run.
      - name: Install Chromium for browser-mode tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Test
        run: pnpm test:cov

      # What the `sonar` job reads for coverage. A day outlives the run.
      - name: Keep the coverage report for the analysis
        if: steps.sonar.outputs.configured == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 1

      - name: Build
        run: pnpm build

      - name: Bundle budgets
        run: pnpm budgets

      # doc 16 §5. The licence appendix on /legal/licenses is generated from the
      # build, so a package that starts shipping without its licence on the page
      # fails here: `pnpm build && pnpm licenses:gen`, then commit the file.
      - name: Licence appendix
        run: pnpm licenses:gen --check

      # doc 21 §5. Greps the built client assets for key names, common key
      # formats, and CDN hosts (doc 15 §6). Any hit fails the build.
      - name: Client bundle secret and CDN gate
        run: |
          set -euo pipefail
          target=.svelte-kit/cloudflare
          if grep -RInE '((FINNHUB|TWELVEDATA)_?KEY|DEV_DASH_TOKEN|TURNSTILE_SECRET_KEY)' "$target"; then
            echo "::error::API key name found in client bundle"
            exit 1
          fi
          if grep -RInE 'https://(cdn|unpkg|jsdelivr|fonts\.googleapis)' "$target"; then
            echo "::error::CDN reference found in client bundle (doc 15 section 6)"
            exit 1
          fi
          echo "secret and CDN gate clean"

      # doc 15 §6. Every dependency, not `--prod`: svelte and SvelteKit, and
      # devalue under them, ship in the Worker and the page from
      # devDependencies, and `--prod` passed on 2026-10-06 with three high
      # devalue advisories in the lock. Not hermetic — an advisory published
      # tomorrow turns today's commit red, which is the point. Last, so a PR's
      # own failures show first. The answers are a lock refresh, an override,
      # or, while no fix exists, a reasoned `auditConfig.ignoreGhsas` entry in
      # pnpm-workspace.yaml.
      - name: Dependency audit
        run: pnpm audit --audit-level high

  # SonarQube Cloud (doc 21 §8), analysed here rather than by the service's
  # automatic analysis, which cannot read coverage. After `ci`, whose test run
  # wrote the report it reads, and only where `ci` found the token. A red
  # quality gate fails this job, and `sonar` is a required check on main.
  sonar:
    needs: ci
    if: needs.ci.outputs.sonar == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Every commit: blame is how new code is told from old.
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      # For the TypeScript rules' type information: `prepare` writes the
      # .svelte-kit/tsconfig.json that tsconfig.json extends, and Paraglide's
      # declarations resolve `$lib/paraglide`. Neither is analysed itself.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Compile messages
        run: pnpm i18n:compile

      - uses: actions/download-artifact@v8
        with:
          name: coverage
          path: coverage

      - id: version
        name: Version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectVersion=${{ steps.version.outputs.version }}
            -Dsonar.qualitygate.wait=true
