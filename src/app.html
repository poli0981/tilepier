<!doctype html>
<!--
	lang and data-theme are the pre-JS defaults: Vietnamese-first (doc 14 §1)
	and dark (doc 05 §2 settings default). boot.js corrects both from
	tp.settings.v1 before first paint, and sets data-legal when the gate has
	already been accepted (doc 16 §2).
-->
<html lang="vi" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#070A0E" media="(prefers-color-scheme: dark)" />
		<meta name="theme-color" content="#F4F1EA" media="(prefers-color-scheme: light)" />
		<!-- Blocking on purpose: must run before first paint. See static/boot.js. -->
		<link rel="manifest" href="/manifest.webmanifest" />
		<!-- The mark (doc 12 §5), drawn by scripts/gen-icons.mjs. Here rather than in a
		     layout so the error page and /legal/* carry it too. -->
		<link rel="icon" href="/favicon.ico" sizes="32x32" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<script src="/boot.js"></script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<!--
			Cloudflare Web Analytics (doc 16 §3): cookieless visit counts and page
			timings. At the end of the body on purpose — SvelteKit's CSP arrives in
			the head as a meta tag, which only governs what follows it, and this
			script is one of the two third-party sources it names (doc 15 §2). Not
			self-hosted: Cloudflare versions the beacon, and a stale copy would
			report into a pipeline that expects the current one.
		-->
		<!-- Cloudflare Web Analytics -->
		<script
			type="module"
			src="https://static.cloudflareinsights.com/beacon.min.js"
			data-cf-beacon='{"token": "ac6b7e4d537f4649909952281591c087"}'
		></script>
		<!-- End Cloudflare Web Analytics -->
	</body>
</html>
