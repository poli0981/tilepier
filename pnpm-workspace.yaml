# pnpm settings. Not a workspace declaration — TilePier is a single package
# (doc 02 §Runtime & tooling). pnpm 11 no longer reads the `pnpm` field from
# package.json, and it renamed `onlyBuiltDependencies` to `allowBuilds`, so the
# doc 15 §6 supply-chain control lives here under the new name.

# doc 15 §6: postinstall scripts are denied by default. Each entry below is an
# explicit, reasoned exception — extend one package at a time, never in bulk.
allowBuilds:
  # Cloudflare Workers runtime binary. wrangler and miniflare cannot start
  # without it, so `pnpm preview`, `wrangler dev`, and the platform-proxy KV
  # path in doc 03 all depend on this build running.
  workerd: true
  # Ships the platform-native binary that Vite invokes for TS transform and
  # dependency pre-bundling. NOTE: doc 15 §6 predicted "esbuild not needed
  # under Vite 8/Rolldown"; verified 2026-08-10 that this is wrong — esbuild is
  # a direct dependency of vite@8.2.1 itself (and of wrangler). Rolldown owns
  # the production bundle, not the whole toolchain.
  esbuild: true
  # Denied for now. msw's postinstall writes mockServiceWorker.js into the
  # project. Nothing imports msw until component tests land (Week 2); generate
  # it deliberately then with `pnpm exec msw init static/` rather than letting
  # install write files as a side effect.
  msw: false

# pnpm 11 gates packages published more recently than its minimum-release-age
# threshold (one day by default) — the caution doc 15 §6 also asks of
# Dependabot's version updates, which wait three.
# Entries here are packages consciously taken before that window elapsed.
minimumReleaseAgeExclude:
  - knip@6.32.1

# Security floors for transitive dependencies whose parents have not moved yet.
# Each entry names its advisory and comes out when the parent's own range does.
overrides:
  # GHSA-pxg6-pf52-xh8x (Dependabot, low): cookie < 0.7.0 accepts out-of-bounds
  # characters in a cookie's name, path and domain. @sveltejs/kit 2.70.x still
  # asks for ^0.6.0. 0.7 keeps 0.6's parse/serialize API, and this app sets no
  # cookies of its own (doc 16 §3), so raising the floor changes nothing it does.
  'cookie@<0.7.0': '^0.7.2'
  # Ten advisories in undici before 7.29.1 by npm's count, six as Dependabot
  # alerts (Week 8); the two high are GHSA-rfgv-xxqx-mfg5 and
  # GHSA-w293-vg96-wgc3. Through miniflare, which wrangler runs for
  # `wrangler dev` and the preview — dev tooling only, nothing in the deployed
  # Worker. miniflare pins 7.29.0 exactly, and Dependabot's own six attempts at
  # a bump failed on that pin.
  # The lock takes 7.30.0 (published 2026-09-25), and the e2e suite runs on it:
  # its server is `wrangler dev`.
  'undici@<7.29.1': '^7.29.1'
  # GHSA-wq5f-xc86-pv6w (high): sharp before 0.35.5, a vulnerable librsvg. It
  # reached npm's audit data on 2026-10-06, between two CI runs of the pull
  # request that added the audit gate. Through miniflare again, which pins
  # sharp 0.35.4 exactly for its Images binding — dev tooling only, nothing the
  # app uses or the Worker ships. 0.35.5 was published 2026-09-27.
  'sharp@<0.35.5': '^0.35.5'
