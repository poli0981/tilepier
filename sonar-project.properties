# SonarQube Cloud, analysed in CI (doc 21 §8). ci.yml's `sonar` job runs the
# scanner after the `ci` job, on that job's coverage report; the service's
# automatic analysis is off, because it cannot read coverage at all.
sonar.organization=poli0981
sonar.projectKey=poli0981_tilepier
sonar.projectName=TilePier
sonar.sourceEncoding=UTF-8

# ── What is product and what is test ────────────────────────────────────────
#
# Tests live beside what they test (doc 19 §1), so src/ is in both lists and
# the file name decides. Generated and vendored files are left out: Paraglide's
# output, the fixtures, the bundled quotes, the licence appendix that
# `pnpm licenses:gen` writes, and the font subsets.
sonar.sources=src,scripts,static,messages,.github,svelte.config.js,vite.config.ts,playwright.config.ts,eslint.config.js,prettier.config.js
sonar.exclusions=src/**/*.test.ts,src/**/*.spec.ts,src/vitest-browser-setup.ts,src/lib/paraglide/**,**/__fixtures__/**,src/lib/widgets/quote/data/**,src/lib/legal/licenses.generated.json,static/fonts/**
sonar.tests=src,e2e
sonar.test.inclusions=src/**/*.test.ts,src/**/*.spec.ts,src/vitest-browser-setup.ts,e2e/**
sonar.typescript.tsconfigPaths=tsconfig.json

# ── Coverage ────────────────────────────────────────────────────────────────
#
# `pnpm test:cov` writes the report. Its scope is vite.config.ts's
# `test.coverage` (doc 19 §2 says what covers each exclusion instead), and this
# list says the same thing in Sonar's terms: everything outside src/lib and
# src/routes/api, then that block's own exclusions. Change the two together, or
# files the tests never measured count here as uncovered.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=scripts/**,static/**,messages/**,.github/**,*.config.js,*.config.ts,src/*.ts,src/*.html,src/*.css,src/routes/*,src/routes/(app)/**,src/routes/about/**,src/routes/legal/**,src/routes/offline/**,src/routes/spike/**,src/lib/widgets/**/Tp*.svelte,src/lib/core/grid/**/*.svelte,src/lib/ui/**/*.svelte,src/lib/core/pwa.svelte.ts,src/lib/widgets/music/tag-worker.ts

# ── Rules that do not apply where they fire ─────────────────────────────────
#
# Each entry is one rule in named files, with the reason it cannot apply there.
# Everything else these rules find is fixed in the code. An entry comes out when
# its reason stops being true.
sonar.issue.ignore.multicriteria=pathTs,pathScripts,pathScriptsTs,workerOrigin,quotesPath,jitter,appTitle

# S4036 (PATH): build tooling runs `git`, `pnpm` and `ffmpeg` by name on the
# developer's machine and the CI runner. Finding them on PATH is the design;
# neither is a place an attacker writes, and nothing here runs in the app.
sonar.issue.ignore.multicriteria.pathTs.ruleKey=typescript:S4036
sonar.issue.ignore.multicriteria.pathTs.resourceKey=vite.config.ts
sonar.issue.ignore.multicriteria.pathScripts.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.pathScripts.resourceKey=scripts/**
sonar.issue.ignore.multicriteria.pathScriptsTs.ruleKey=typescript:S4036
sonar.issue.ignore.multicriteria.pathScriptsTs.resourceKey=scripts/**

# S2819 (message origin): the tag worker is a dedicated Worker. Only the page
# that created it can post to it, and its messages carry no origin to check.
sonar.issue.ignore.multicriteria.workerOrigin.ruleKey=typescript:S2819
sonar.issue.ignore.multicriteria.workerOrigin.resourceKey=src/lib/widgets/music/tag-worker.ts

# S8707 (path from a command-line argument): quotes-import.mjs is run by hand,
# never in CI, to read a sibling checkout of QuoteAtlas that the person running
# it names. Reading the path it is given is the whole job.
sonar.issue.ignore.multicriteria.quotesPath.ruleKey=jssecurity:S8707
sonar.issue.ignore.multicriteria.quotesPath.resourceKey=scripts/quotes-import.mjs

# S2245 (pseudo-random numbers): the scheduler's ±20 % backoff jitter only has
# to differ between tabs (doc 17 §5). Nothing depends on it being unguessable.
sonar.issue.ignore.multicriteria.jitter.ruleKey=typescript:S2245
sonar.issue.ignore.multicriteria.jitter.resourceKey=src/lib/core/scheduler.ts

# Web:PageWithoutTitleCheck: app.html is SvelteKit's template, not a page.
# Every page sets its title through <svelte:head>, and a static <title> here
# would come first in the document and override them all.
sonar.issue.ignore.multicriteria.appTitle.ruleKey=Web:PageWithoutTitleCheck
sonar.issue.ignore.multicriteria.appTitle.resourceKey=src/app.html
